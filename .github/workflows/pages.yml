# Build from tracked source on Windows; deploy the generated v4 output only on main.
name: Deploy GitHub Pages

on:
  push:
    branches: ["main", "fix/defyer-measurement-history-20261124"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build with existing pipeline
        shell: pwsh
        run: ./build.ps1
      - name: Verify measurement fields reached compiled UI
        shell: pwsh
        run: |
          # esbuild escapes Japanese text as Unicode sequences. Check stable field identifiers instead.
          $html = Get-Content -Raw -Encoding UTF8 ./v4/index.html
          $heavy = Get-Content -Raw -Encoding UTF8 ./v4/bundle-heavy.js
          foreach ($field in @("measuredAt","swingWeight","twistWeight","lead3","lead9","fixture","gripSetup","stringState")) {
            if (-not $html.Contains($field)) { throw "Missing compiled input field: $field" }
          }
          foreach ($field in @("measuredAt","swingWeight","twistWeight","lead3","lead9","gripSetup","stringState")) {
            if (-not $heavy.Contains($field)) { throw "Missing compiled history display field: $field" }
          }
          Write-Host "Compiled UI contains every measurement field."
      - name: Prepare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
